<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shuttle</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="logo">Shuttle</h1>
    <span id="conn-status" class="status status--offline">Connecting…</span>
  </header>

  <main class="layout">
    <section class="card">
      <h2 id="court-label">The court</h2>
      <p class="muted">You are <strong id="you-name">…</strong></p>
    </section>

    <section class="card">
      <h2>Shared text</h2>
      <textarea id="court-text" rows="6" placeholder="Type or paste here. Everyone on the court sees it live."></textarea>
      <div class="row">
        <button id="copy-text" type="button">Copy</button>
        <button id="clear-text" type="button">Clear</button>
        <span id="text-meta" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <h2>Players on court <span id="device-count" class="badge">0</span></h2>
      <ul id="device-list" class="device-list"></ul>
      <p id="devices-empty" class="muted">No one else here yet. Open Shuttle on another device on this Wi-Fi.</p>
    </section>
    <details class="card">
      <summary>Under the net (WebRTC log)</summary>
      <ol id="rtc-log" class="log"></ol>
    </details>
  </main>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <!-- Socket.IO serves its own browser client at this path. -->
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
